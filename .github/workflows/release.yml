name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction --no-progress

    - name: Setup environment
      run: |
        echo "APP_KEY=base64:MFOsOH9RomiI2LRdgP4hIeoQJ5nyBhdABdH77UY2zi8=" > .env
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE=:memory:" >> .env

    - name: Check PHP syntax
      run: |
        echo "Checking PHP syntax for all source files..."
        find src tests -name "*.php" -exec php -l {} \; || exit 1

    - name: Run code style check
      run: |
        echo "Running Laravel Pint code style check..."
        vendor/bin/pint --test

    - name: Run test suite
      run: |
        echo "Running PHPUnit test suite..."
        vendor/bin/phpunit --testdox

    - name: Run test suite with coverage
      run: |
        echo "Running test suite with coverage..."
        vendor/bin/phpunit --testdox --coverage-text --coverage-clover=coverage.clover

  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_without_v=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        release_name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## 🎉 Release ${{ steps.get_version.outputs.version }}
          
          ### 📋 Release Summary
          This is an automated release created by GitHub Actions.
          
          ### 🧪 Test Results
          - ✅ All tests passed
          - ✅ Code style validation passed
          - ✅ PHP syntax validation passed
          - ✅ Coverage reports generated
          
          ### 📦 What's Included
          - Source code from `src/` directory
          - Database migrations and factories
          - Configuration files
          - Composer package definition
          
          ### 🚀 Installation
          ```bash
          composer require turahe/ledger:${{ steps.get_version.outputs.version_without_v }}
          ```
          
          ### 📚 Documentation
          - [Changelog](https://github.com/turahe/ledger/blob/master/CHANGELOG.md)
          - [Source Code](https://github.com/turahe/ledger/tree/${{ steps.get_version.outputs.version }}/src)
          
          ---
          
          *This release was automatically generated by GitHub Actions.*
        draft: false
        prerelease: false

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ steps.get_version.outputs.version }}
        path: coverage/
        retention-days: 30

    - name: Update Private Satis Repository
      uses: easingthemes/ssh-deploy@v5.1.0
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SATIS_SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ vars.SATIS_SERVER_IP }}
        REMOTE_USER: ${{ vars.SATIS_SERVER_USER }}
        REMOTE_PORT: '22'
        TARGET: '/home/default/satis'
        SCRIPT_AFTER: |
          echo "📦 Running Satis generate.sh script..."
          
          # Navigate to Satis directory
          cd /home/default/satis
          
          # Check if generate.sh exists and is executable
          if [ -f "generate.sh" ]; then
            echo "✅ Found generate.sh script"
            
            # Make sure it's executable
            chmod +x generate.sh
            
            # Run the generate script
            ./generate.sh
            
            echo "✅ Satis repository updated successfully using generate.sh!"
          else
            echo "⚠️ generate.sh not found, falling back to manual Satis build"
            
            # Fallback to manual Satis build
            php bin/satis build satis.json public/
            
            # Clear any caches if needed
            if [ -f "public/clear-cache.sh" ]; then
              chmod +x public/clear-cache.sh
              ./public/clear-cache.sh
            fi
            
            echo "✅ Satis repository updated successfully using manual build!"
          fi
          
          echo "📊 Package ${{ steps.get_version.outputs.version }} is now available"

    - name: Display Release Info
      run: |
        echo "🎉 Release ${{ steps.get_version.outputs.version }} created successfully!"
        echo "📊 Coverage report uploaded as artifact"
        echo "🔄 Private Satis repository updated on ${{ vars.SATIS_SERVER_IP }}"
        echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}"
