name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: pcov

    - name: Cache Composer packages
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-

    - name: Install dependencies
      run: |
        composer install --prefer-dist --no-interaction --no-progress

    - name: Setup environment
      run: |
        echo "APP_KEY=base64:MFOsOH9RomiI2LRdgP4hIeoQJ5nyBhdABdH77UY2zi8=" > .env
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE=:memory:" >> .env

    - name: Check PHP syntax
      run: |
        echo "Checking PHP syntax for all source files..."
        find src tests -name "*.php" -exec php -l {} \; || exit 1

    - name: Run code style check
      run: |
        echo "Running Laravel Pint code style check..."
        vendor/bin/pint --test

    - name: Run test suite
      run: |
        echo "Running PHPUnit test suite..."
        vendor/bin/phpunit --testdox

    - name: Run test suite with coverage
      run: |
        echo "Running test suite with coverage..."
        vendor/bin/phpunit --testdox --coverage-text --coverage-clover=coverage.clover

  release:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup SSH for Private Repository
      run: |
        echo "🔑 Setting up SSH for private repository access..."
        
        # Create SSH directory
        mkdir -p ~/.ssh
        
        # Add the private key (you'll need to add this as a secret)
        echo "${{ secrets.SATIS_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Add server to known hosts
        ssh-keyscan -H 178.128.84.149 >> ~/.ssh/known_hosts
        
        echo "✅ SSH setup completed!"

    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_without_v=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        release_name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## 🎉 Release ${{ steps.get_version.outputs.version }}
          
          ### 📋 Release Summary
          This is an automated release created by GitHub Actions.
          
          ### 🧪 Test Results
          - ✅ All tests passed
          - ✅ Code style validation passed
          - ✅ PHP syntax validation passed
          - ✅ Coverage reports generated
          
          ### 📦 What's Included
          - Source code from `src/` directory
          - Database migrations and factories
          - Configuration files
          - Composer package definition
          
          ### 🚀 Installation
          ```bash
          composer require turahe/ledger:${{ steps.get_version.outputs.version_without_v }}
          ```
          
          ### 📚 Documentation
          - [Changelog](https://github.com/turahe/ledger/blob/master/CHANGELOG.md)
          - [Source Code](https://github.com/turahe/ledger/tree/${{ steps.get_version.outputs.version }}/src)
          
          ---
          
          *This release was automatically generated by GitHub Actions.*
        draft: false
        prerelease: false

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ steps.get_version.outputs.version }}
        path: coverage/
        retention-days: 30

    - name: Update Private Satis Repository
      run: |
        echo "🔄 Updating private Satis repository on 178.128.84.149..."
        
        # SSH into the server and update Satis
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          root@178.128.84.149 << 'EOF'
          
          echo "📦 Updating Satis repository..."
          
          # Navigate to Satis directory (adjust path if needed)
          cd /var/www/satis || cd /opt/satis || cd ~/satis
          
          # Update Satis with the new package version
          php bin/satis build satis.json public/
          
          # Clear any caches if needed
          if [ -f "public/clear-cache.sh" ]; then
            chmod +x public/clear-cache.sh
            ./public/clear-cache.sh
          fi
          
          echo "✅ Satis repository updated successfully!"
          echo "📊 Package ${{ steps.get_version.outputs.version }} is now available"
        EOF
        
        echo "✅ Private Satis repository update completed!"

    - name: Display Release Info
      run: |
        echo "🎉 Release ${{ steps.get_version.outputs.version }} created successfully!"
        echo "📊 Coverage report uploaded as artifact"
        echo "🔄 Private Satis repository updated on 178.128.84.149"
        echo "🔗 Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}"
