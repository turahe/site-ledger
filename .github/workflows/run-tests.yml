name: run-tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        dependency-version: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php-version }} - ${{ matrix.dependency-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: pcov

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependency-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-${{ matrix.dependency-version }}-

    - name: Install dependencies
      run: |
        composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

    - name: Setup environment
      run: |
        echo "APP_KEY=base64:MFOsOH9RomiI2LRdgP4hIeoQJ5nyBhdABdH77UY2zi8=" > .env
        echo "DB_CONNECTION=sqlite" >> .env
        echo "DB_DATABASE=:memory:" >> .env

    - name: Check PHP syntax
      run: |
        echo "Checking PHP syntax for all source files..."
        find src tests -name "*.php" -exec php -l {} \; || exit 1

    - name: Run code style check
      continue-on-error: true
      run: |
        if [ -f "vendor/bin/pint" ]; then
          echo "Running Laravel Pint code style check..."
          vendor/bin/pint --test
        else
          echo "Laravel Pint not available, skipping code style check"
        fi

    - name: Run test suite
      run: |
        echo "Running PHPUnit test suite..."
        vendor/bin/phpunit --testdox

    - name: Run test suite with coverage (stable only)
      if: matrix.dependency-version == 'prefer-stable'
      run: |
        echo "Running test suite with coverage..."
        vendor/bin/phpunit --testdox --coverage-text --coverage-clover=coverage.clover

    - name: Display test results
      run: |
        echo "✅ All tests completed successfully!"
