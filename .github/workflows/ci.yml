name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel-version }})
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4']
        laravel-version: ['11.*']
        dependency-version: ['prefer-stable']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, iconv, json, mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, session, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip, curl, fileinfo, openssl, pcntl, posix, sodium, zlib
        coverage: xdebug
        tools: composer:v2

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Copy environment file
      run: cp .env.example .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Directory permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: vendor/bin/phpunit --coverage-clover=coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, iconv, json, mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, session, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip, curl, fileinfo, openssl, pcntl, posix, sodium, zlib
        tools: composer:v2

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --memory-limit=2G

    - name: Run PHP CS Fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, iconv, json, mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, session, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip, curl, fileinfo, openssl, pcntl, posix, sodium, zlib
        tools: composer:v2

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Run PHP Mess Detector
      run: vendor/bin/phpmd src text cleancode,codesize,controversial,design,naming,unusedcode

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [tests, static-analysis, code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, iconv, json, mbstring, pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, phar, session, simplexml, tokenizer, xml, xmlreader, xmlwriter, zip, curl, fileinfo, openssl, pcntl, posix, sodium, zlib
        tools: composer:v2

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

    - name: Build success
      run: echo "Build completed successfully!"
